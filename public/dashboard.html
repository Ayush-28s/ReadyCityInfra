<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ready City - Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body {
            font-family: 'Outfit', sans-serif;
        }

        .glass {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(10px);
        }
    </style>
</head>

<body class="bg-gray-50 flex h-screen overflow-hidden">

    <!-- Sidebar -->
    <aside class="w-64 bg-slate-900 text-white hidden md:flex flex-col transition-all">
        <div class="p-6 border-b border-slate-800">
            <h1
                class="text-2xl font-bold tracking-tight text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-purple-500">
                Ready City</h1>
        </div>
        <nav class="flex-1 py-6 space-y-1 px-3">
            <button onclick="loadSection('stats')"
                class="w-full flex items-center space-x-3 px-4 py-3 rounded-lg hover:bg-slate-800 transition-colors text-slate-300 hover:text-white"
                id="nav-stats">
                <i data-lucide="layout-dashboard" class="w-5 h-5"></i><span>Overview</span>
            </button>
            <button onclick="loadSection('properties')"
                class="w-full flex items-center space-x-3 px-4 py-3 rounded-lg hover:bg-slate-800 transition-colors text-slate-300 hover:text-white"
                id="nav-properties">
                <i data-lucide="building-2" class="w-5 h-5"></i><span>Properties</span>
            </button>
            <button onclick="loadSection('users')"
                class="w-full flex items-center space-x-3 px-4 py-3 rounded-lg hover:bg-slate-800 transition-colors text-slate-300 hover:text-white"
                id="nav-users">
                <i data-lucide="users" class="w-5 h-5"></i><span>Users</span>
            </button>
            <button onclick="loadSection('leads')"
                class="w-full flex items-center space-x-3 px-4 py-3 rounded-lg hover:bg-slate-800 transition-colors text-slate-300 hover:text-white"
                id="nav-leads">
                <i data-lucide="message-square" class="w-5 h-5"></i><span>Leads</span>
            </button>
        </nav>
        <div class="p-4 border-t border-slate-800">
            <button onclick="logout()"
                class="w-full flex items-center justify-center space-x-2 px-4 py-2 bg-red-600 hover:bg-red-700 rounded-lg transition-colors text-sm font-medium">
                <i data-lucide="log-out" class="w-4 h-4"></i><span>Logout</span>
            </button>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 overflow-y-auto">
        <header
            class="bg-white border-b border-gray-200 px-8 py-4 flex justify-between items-center sticky top-0 z-10 glass">
            <h2 class="text-xl font-semibold text-gray-800" id="page-title">Dashboard</h2>
            <div class="flex items-center space-x-4">
                <div
                    class="h-8 w-8 rounded-full bg-gradient-to-r from-blue-500 to-purple-500 flex items-center justify-center text-white font-bold text-sm">
                    A
                </div>
            </div>
        </header>

        <div class="p-8" id="content-area">
            <!-- Dynamic Content -->
            <div class="flex items-center justify-center h-64">
                <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-600"></div>
            </div>
        </div>
    </main>

    <!-- Modals -->
    <div id="modal-container" class="fixed inset-0 z-50 hidden">
        <div class="absolute inset-0 bg-black/60 backdrop-blur-sm" onclick="closeModal()"></div>
        <div class="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 bg-white rounded-xl shadow-2xl p-6 w-full max-w-lg"
            id="modal-content">
            <!-- Modal Content -->
        </div>
    </div>

    <script src="js/dashboard.js"></script>
    <script>
        lucide.createIcons();
    </script>
</body>

</html>
