<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Ready City Infra</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: '#005f99',
                        'brand-dark': '#004a78',
                    },
                    fontFamily: {
                        sans: ['Manrope', 'sans-serif'],
                    }
                }
            }
        }
    </script>
</head>
<!-- UPDATED: Use min-h-screen and allow scrolling (Matches Signup Page) -->
<body class="font-sans antialiased min-h-screen bg-gray-900 relative overflow-x-hidden">

    <!-- 1. BACKGROUND LAYER (Fixed) -->
    <div class="fixed inset-0 z-0">
        <img src="https://images.unsplash.com/photo-1486406146926-c627a92ad1ab?q=80&w=2070&auto=format&fit=crop" 
             class="w-full h-full object-cover opacity-60">
        <div class="absolute inset-0 bg-gradient-to-br from-brand-dark/95 via-brand/85 to-black/70"></div>
    </div>

    <!-- 2. HUGE BACKGROUND TYPOGRAPHY -->
    <div class="fixed inset-0 z-0 flex items-center justify-center overflow-hidden pointer-events-none select-none">
        <h1 class="text-[15vw] font-[900] text-white/5 leading-none tracking-tighter uppercase transform -rotate-12 whitespace-nowrap blur-sm">
            READY CITY
        </h1>
    </div>

    <!-- 3. MAIN CONTENT LAYER (Scrollable) -->
    <div class="relative z-10 flex flex-col justify-center items-center min-h-screen py-10 px-4">
        
        <!-- GLASS CARD -->
        <div class="w-full max-w-[450px] bg-white/10 backdrop-blur-xl border border-white/20 rounded-3xl shadow-2xl p-8 animate-fade-up">
            
            <!-- LOGO SECTION -->
            <div class="flex flex-col items-center mb-8">
                <div class="w-24 h-24 bg-white rounded-full flex items-center justify-center shadow-2xl mb-5 p-4 overflow-hidden ring-4 ring-white/10">
                     <img src="images/logo.png" alt="Logo" class="w-full h-full object-contain">
                </div>
                
                <h2 class="text-3xl font-bold text-white tracking-tight">Welcome Back</h2>
                <p class="text-blue-100/80 text-sm mt-1">Ready City Infra Partner Portal</p>
            </div>

            <!-- FORM -->
            <form id="loginForm" class="space-y-5">
                
                <!-- User ID / Phone (With Correct ID) -->
                <div class="group">
                    <label class="block text-blue-100 text-[10px] font-bold uppercase tracking-widest mb-2 ml-1 opacity-80">User ID / Phone</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                            <i class="fas fa-user text-blue-200"></i>
                        </div>
                        <!-- ID added here: loginInput -->
                        <input type="text" id="loginInput" placeholder="Enter Username or Phone" 
                            class="w-full bg-white/5 border border-white/20 text-white placeholder-blue-200/40 text-sm rounded-xl focus:bg-white/10 focus:ring-2 focus:ring-blue-400/50 focus:border-white/50 block w-full pl-11 p-3.5 transition-all outline-none" required>
                    </div>
                </div>

                <!-- Password -->
                <div>
                    <label class="block text-blue-100 text-[10px] font-bold uppercase tracking-widest mb-2 ml-1 opacity-80">Password</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                            <i class="fas fa-lock text-blue-200"></i>
                        </div>
                        <input type="password" id="passwordInput" placeholder="Enter Password" 
                            class="w-full bg-white/5 border border-white/20 text-white placeholder-blue-200/40 text-sm rounded-xl focus:bg-white/10 focus:ring-2 focus:ring-blue-400/50 focus:border-white/50 block w-full pl-11 p-3.5 transition-all outline-none" required>
                        <!-- Eye Icon -->
                        <div class="absolute inset-y-0 right-0 pr-4 flex items-center cursor-pointer text-blue-200/70 hover:text-white transition" onclick="togglePassword()">
                            <i class="fas fa-eye" id="eyeIcon"></i>
                        </div>
                    </div>
                    <div class="flex justify-end mt-2">
                        <a href="#" class="text-xs text-blue-200 hover:text-white transition opacity-80 hover:opacity-100">Forgot password?</a>
                    </div>
                </div>

                <!-- CAPTCHA (CSS Pattern Version) -->
                <div class="bg-black/20 rounded-xl p-3 border border-white/5">
                    <div class="flex justify-between items-center mb-2">
                        <label class="block text-blue-100 text-[10px] font-bold uppercase tracking-widest opacity-80">Security Code</label>
                        <button type="button" onclick="generateCaptcha()" class="text-[10px] text-blue-300 hover:text-white flex items-center gap-1 transition cursor-pointer z-20">
                            <i class="fas fa-sync-alt"></i> Refresh
                        </button>
                    </div>
                    <div class="flex gap-3">
                        <!-- DISPLAY BOX -->
                        <div id="captchaDisplay" class="w-1/3 bg-gray-100 text-slate-800 font-mono text-xl font-bold tracking-[0.3em] flex items-center justify-center rounded-lg select-none relative overflow-hidden">
                            <div class="absolute inset-0 opacity-20 pointer-events-none" style="background-image: radial-gradient(#000 1px, transparent 1px); background-size: 4px 4px;"></div>
                            <span class="relative z-10">----</span>
                        </div>
                        <!-- INPUT BOX -->
                        <input type="text" id="captchaInput" placeholder="Type here" 
                            class="w-2/3 bg-white/5 border border-white/20 text-white text-center text-lg rounded-lg focus:ring-2 focus:ring-blue-400/50 outline-none transition-all p-2 tracking-widest" maxlength="4" required>
                    </div>
                </div>

                <!-- Submit Button -->
                <button type="submit" class="w-full bg-gradient-to-r from-blue-500 via-brand to-brand-dark hover:from-blue-400 hover:to-brand text-white font-bold py-4 rounded-xl shadow-lg shadow-brand/30 transform hover:-translate-y-0.5 active:translate-y-0 transition-all duration-200 flex justify-center items-center gap-2 border border-white/10">
                    <span>Sign In</span>
                    <i class="fas fa-arrow-right"></i>
                </button>

            </form>

            <!-- Back to Signup -->
            <div class="mt-6 text-center border-t border-white/10 pt-4">
                <p class="text-blue-200/60 text-sm">
                    New to Ready City? 
                    <a href="/signup.html" class="text-white font-bold hover:text-blue-300 transition ml-1 underline decoration-blue-400/30 underline-offset-4">Create Account</a>
                </p>
            </div>
        </div>

        <!-- Footer -->
        <p class="text-white/30 text-xs mt-8 font-light">
            &copy; 2024 Ready City Infra Pvt Ltd.
        </p>
    </div>

    <!-- JAVASCRIPT (Using correct IDs) -->
    <script>
        let captchaCode = '';

        // 1. CAPTCHA
        function generateCaptcha() {
            const displayBox = document.getElementById('captchaDisplay');
            const inputBox = document.getElementById('captchaInput');
            if (!displayBox) return;
            
            captchaCode = Math.floor(1000 + Math.random() * 9000).toString();
            const textSpan = displayBox.querySelector('span');
            if (textSpan) textSpan.innerText = captchaCode;
            else displayBox.innerText = captchaCode;
            if (inputBox) inputBox.value = ''; 
        }

        // 2. TOGGLE PASSWORD
        function togglePassword() {
            const x = document.getElementById("passwordInput");
            const eye = document.getElementById("eyeIcon");
            if (x.type === "password") {
                x.type = "text";
                eye.classList.remove('fa-eye');
                eye.classList.add('fa-eye-slash');
            } else {
                x.type = "password";
                eye.classList.remove('fa-eye-slash');
                eye.classList.add('fa-eye');
            }
        }

        // 3. LOGIN LOGIC
        const loginForm = document.getElementById('loginForm');
        if (loginForm) {
            loginForm.addEventListener('submit', async function(e) {
                e.preventDefault();

                // A. Captcha Check
                const captchaInput = document.getElementById('captchaInput').value;
                if (captchaInput !== captchaCode) {
                    alert('Invalid Security Code');
                    generateCaptcha();
                    return;
                }

                // B. Get Inputs (Using specific IDs)
                const loginInput = document.getElementById('loginInput'); 
                const passwordInput = document.getElementById('passwordInput');
                const btn = this.querySelector('button[type="submit"]');
                const originalText = btn.innerHTML;

                // C. Clean Inputs (Trim spaces)
                const phone = loginInput.value.trim();
                const password = passwordInput.value.trim();

                // D. Send Request
                btn.innerHTML = 'Verifying...';
                btn.disabled = true;

                try {
                    const response = await fetch('/api/login', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ phone, password }) 
                        // We send 'phone' as the key because backend expects req.body.phone
                    });

                    const data = await response.json();

                    if (response.ok) {
                        // Success -> Dashboard
                        localStorage.setItem('user', JSON.stringify(data.user));
                        window.location.href = '/admin.html';
                    } else {
                        // Error -> Alert User
                        alert('Error: ' + data.message);
                        generateCaptcha();
                    }

                } catch (error) {
                    console.error(error);
                    alert('Connection Error. Try again.');
                } finally {
                    btn.innerHTML = originalText;
                    btn.disabled = false;
                }
            });
        }

        // Init
        document.addEventListener('DOMContentLoaded', () => {
            generateCaptcha();
        });
    </script>
</body>
</html>
